services:
  db:
    image: postgres:16-alpine
    network_mode: host
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-radio}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-radio}
      POSTGRES_DB: ${POSTGRES_DB:-radio}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-radio}"]
      interval: 5s
      timeout: 5s
      retries: 5

  mailpit:
    image: axllent/mailpit:latest
    network_mode: host

  backend:
    build:
      context: ./backend
      network: host
    network_mode: host
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-radio}:${POSTGRES_PASSWORD:-radio}@localhost:5432/${POSTGRES_DB:-radio}
    volumes:
      - ./backend/src:/app/src
      - ./backend/alembic:/app/alembic
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started

  frontend:
    build:
      context: ./frontend
      network: host
    network_mode: host
    volumes:
      - ./frontend/src:/app/src
    depends_on:
      - backend

volumes:
  db_data:
